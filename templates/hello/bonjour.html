<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Django</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
            font-size: 1.2em;
            color: #444;
        }
        .card {
            background: #f8f8ff;
            border-radius: 15px;
            padding: 20px;
            margin-top: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Liste des personnes 🚀</h1>
        <ul>
            {% for personne in personnes %}
                <li class="card">
                    <strong>{{ personne.nom }}</strong><br>
                    Âge : {{ personne.age }} ans<br>
                    Ville : {{ personne.ville }}
                </li>
                {% if personne.age > 70 %}
                <h2>Monsieur {{personne.nom}} vous êtes banni</h2>

                {% endif %}
            {% endfor %}
        </ul>
    </div>
</body>
</html>
